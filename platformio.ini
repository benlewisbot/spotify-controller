; PlatformIO Project Configuration File for Spotify Controller ESP32
; Build using LVGL 8.3.x with Arduino framework

[platformio]
default_envs = esp32-s3-4848s040

[env:esp32-s3-4848s040]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino

; Board configuration for ESP32-S3 with 16MB Flash + 8MB PSRAM
; Flash is QIO (quad), PSRAM is OPI (octal)
board_build.arduino.memory_type = qio_opi
board_build.partitions = default_16MB.csv
board_build.arduino.psram_type = opi
board_upload.flash_size = 16MB

; Build flags
build_flags =
    -std=gnu++17
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=3
    -DUSE_LVGL
    -DLV_CONF_PATH=\"lv_conf.h\"
    -DLITTLEFS_UPLOAD_MAX_FILE_SIZE=1048576
    ; Disable ARM assembly in LVGL (we're on Xtensa ESP32)
    -DLV_DRAW_SW_HELIUM=0
    ; Display configuration for Guition ESP32-S3-4848S040
    -DDISPLAY_ST7701S
    -DSCREEN_WIDTH=480
    -DSCREEN_HEIGHT=480
    -DSCREEN_ROTATION=0
    ; Pin configuration
    -DTFT_CS=39
    -DTFT_DC=18
    -DTFT_RST=-1
    -DTFT_BL=38
    -DTOUCH_SDA=19
    -DTOUCH_SCL=45
    -DTOUCH_INT=-1
    -DTOUCH_RST=-1
    ; Include paths
    -I.
    -Iinclude
    -Isrc
build_unflags = -std=gnu++11

; Library dependencies
lib_deps =
    ; LVGL - Main graphics library
    lvgl/lvgl@^9.0.0
    ; ArduinoJson - JSON parsing
    bblanchon/ArduinoJson@^6.21.5
    ; WebServer - For OAuth captive portal
    esphome/ESPAsyncWebServer-esphome@^3.1.0
    ; LovyanGFX - Display driver for RGB parallel
    lovyan03/LovyanGFX@^1.1.9
    ; TFT_eSPI - Display driver for SPI displays
    bodmer/TFT_eSPI@^2.5.43

; Library ignore - skip ARM-specific files
lib_ignore =
    lvgl/draw/sw/blend/helium

; Serial monitor options
monitor_speed = 115200
monitor_filters = esp32_exception_decoder

; Upload options
upload_speed = 921600

; Debug configuration
debug_tool = esp-prog
debug_init_break = tbreak setup

[env:esp32-wrover]
platform = espressif32
board = esp32dev
framework = arduino

; Board configuration
board_build.arduino.memory_type = opi_opi
board_build.partitions = default.csv
board_build.arduino.psram_type = opi

; Build flags
build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=3
    -DUSE_LVGL
    -DLV_CONF_PATH=\"lv_conf.h\"
    -DLITTLEFS_UPLOAD_MAX_FILE_SIZE=1048576
    -Iinclude
    -Isrc

; Serial monitor options
monitor_speed = 115200
monitor_filters = esp32_exception_decoder

; Library dependencies
lib_deps =
    ; LVGL - Main graphics library
    lvgl/lvgl@^9.0.0
    ; ArduinoJson - JSON parsing
    bblanchon/ArduinoJson@^6.21.5
    ; WebServer - For OAuth captive portal
    esphome/ESPAsyncWebServer-esphome@^3.1.0

; Upload options
upload_speed = 921600

; Debug configuration
debug_tool = esp-prog
debug_init_break = tbreak setup

[env:wokwi]
; For Wokwi simulation
platform = espressif32
board = esp32dev
framework = arduino

build_flags =
    -DWOKWI_SIMULATION
    -DUSE_LVGL
    -DLV_CONF_PATH=\"lv_conf.h\"
    -Iinclude
    -Isrc

lib_deps =
    lvgl/lvgl@^9.0.0
    bblanchon/ArduinoJson@^6.21.5
    esphome/ESPAsyncWebServer-esphome@^3.1.0
